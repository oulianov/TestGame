; The DynRPG settings of Fighting Robots Quest, with switch and variable ids that fit this project.
; The three value formats of the quickpatches are used: hex bytes, #n (4 bytes) and %n (1 byte).
[QuickPatches]
; KillSwitch: the party dying on the map leads to the Game Over only while switch 50 is ON
KillSwitch=4A43F1,32000000
; Direct Menu Patch: variable 50 opens a sub-screen of the menu directly
DMPVar=446EDE,#50

; status window: no "Title" and "Class" labels, the class and title lower, in color 0
RemoveClassTitle=49F9AD,00,49FA0C,00
StatusClass(y)=49F9E8,#104
StatusTitle(y)=49FA31,#88
StatusClassColor=49F9E4,%0
StatusTitleColor=49FA2D,%0


[faster_atb_advanced]
; 1 to 16 = 100 to 1600 %, -4 to -1 = 0, 25, 50, 75 %
BattleSpeedVariable=10
DefaultSpeed=100


[Exp_Curves]
; Much steeper than RPG_RT's curve: the EXP needed doubles at each level (base 30, inflation 1, correction 0
; gives 15330 EXP for level 10 and 30690 for level 11, against 315 and 355 without the plugin)
;initial mutiplier for EXP(Sec)
CoefficientA=1000000
;initial reduction for EXP(Sec)
CoefficientB=1000000
;level multiplier for EXP(Sec) (growth)
CoefficientC=0
;level multiplier for EXP(Sec) (basis)
CoefficientD=1000000
;growth correction
CoefficientE=0


[game_clock]
SessionStart=21
SessionCurrent=22
SessionSecs=23
PlaytimeSecs=24
PlaytimeHH=25
PlaytimeMM=26
PlaytimeSS=27
RestartTrigger=28
ForegroundVar=29
BackgroundVar=30
ForegroundImage=Picture\menu-time_fg.png
DummyImage=Picture\Pixel.png
BackgroundImage=Picture\Pixel.png
TimeTextDisplay=Time


