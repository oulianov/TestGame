; EasyRPG Player settings of the DynRPG test project; RPG_RT.exe ignores this file.
; With DynRPG, the Player reads the patches of DynPatches/ and the [QuickPatches] of DynRPG.ini as
; RPG_RT.exe does, and emulates the ones it knows: Direct Menu (DMP, variable 50), KillSwitch
; (switch 50), norow, RPG_RT_FixBattlerFlash and the quickpatches of the status window.
; Any [Patch] key turns off the Player's own patch detection (dynloader.dll => DynRPG), hence DynRPG=1.
; Run the Player with --no-patch to see the same game without DynRPG (plain RPG_RT 2003).
[Game]
Engine=rpg2k3e

[Patch]
; RPG_RT.exe has the DynRPG 0.20 patch
DynRPG=1
; DynRPG 0.20 runs picture commands while a message is shown
PicUnlock=1

; The DynRPG plugins the Player runs, by the names of their DLL in DynPlugins (it doesn't need
; the DLLs). Without this list it finds them: their DLL, or their section in DynRPG.ini.
[DynRPG]
Plugins=DynTextPlugin, DynParams, msg_commands, faster_atb_advanced, game_clock, ATBWaitOnly, ExpBug-in
